[project]
name = "fmvcore"
version = "0.1.0"
description = "The baker and measurement code shared by the full-motion video players of one family"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "faker==40.43.0",
]
release = [
    "python-semantic-release==10.7.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmvcore"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ARG", "PTH"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    "ffmpeg: decodes through ffmpeg; skipped without it unless FMVCORE_FFMPEG_REQUIRED=1",
]

[tool.coverage.run]
source = ["fmvcore"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
default_templates = { changelog_file = "RELEASES.md" }

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"
