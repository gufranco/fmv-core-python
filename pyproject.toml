[project]
name = "fmvcore"
version = "1.1.0"
description = "The baker and measurement code shared by the full-motion video players of one family"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "faker==40.43.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmvcore"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ARG", "PTH"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    "ffmpeg: decodes through ffmpeg; skipped without it unless FMVCORE_FFMPEG_REQUIRED=1",
    "cc: compiles a C fixture; skipped without cc unless FMVCORE_CC_REQUIRED=1",
]

[tool.coverage.run]
source = ["fmvcore"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

