name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: >-
          Force a bump level. Leave as commits to let the history decide.
        required: false
        default: commits
        type: choice
        options: [commits, patch, minor, major]

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install ffmpeg, which the decode path shells out to
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: The gate the CI job runs
        env:
          FMVCORE_FFMPEG_REQUIRED: "1"
          FMVCORE_CC_REQUIRED: "1"
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy fmvcore
          uv run python -m pytest --cov=fmvcore --cov-fail-under=95

  publish:
    name: Publish
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.23"

      - name: What the next version will be
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          release=(uv run --only-group release)
          if [ "$LEVEL" = "commits" ]; then
            "${release[@]}" semantic-release --noop version --print
          else
            "${release[@]}" semantic-release --noop version "--$LEVEL" --print
          fi

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          release=(uv run --only-group release)
          if [ "$LEVEL" = "commits" ]; then
            "${release[@]}" semantic-release version --push --vcs-release
          else
            "${release[@]}" semantic-release \
              version "--$LEVEL" --push --vcs-release
          fi
